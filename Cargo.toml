[package]
name = "mcleanup"
version = "0.2.0"
edition = "2024"
description = "Fast macOS cache cleanup (Rust port of cache-cleanup.sh)"

[dependencies]
rayon = "1.12"
jwalk = "0.8"  # parallel directory walker

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
